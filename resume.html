<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yihan Zhang — Original Resume</title>
  <style>
    @font-face{font-family:Outfit;src:url('assets/fonts/outfit-400.ttf') format('truetype');font-weight:400;font-display:swap}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f8f8f8;color:#212121}
    body{font-family:Outfit,sans-serif}
    .resume-toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,3.3vw,48px);border-bottom:1px solid #e5e5e5;font-size:14px}
    a{color:inherit;text-decoration:none;padding:6px 0}
    a:hover{text-decoration:underline;text-underline-offset:4px}
    a:focus-visible{outline:2px solid #171717;outline-offset:5px}
    ::selection{background:#171717;color:#fafafa}
    main{width:100%;margin:0}
    .resume-image{display:block;width:100%;height:auto;margin:0}
    @media(max-width:480px){.resume-toolbar{font-size:13px}}
    html{scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    
  </style>
</head>
<body>
  <nav class="resume-toolbar" aria-label="Resume actions">
    <a href="index.html#about">← Back to portfolio</a>
    <a href="assets/yihan-resume.png" download="Yihan-Zhang-Resume.png">Download PNG ↓</a>
  </nav>
  <main>
    <img class="resume-image" src="assets/yihan-resume.png" width="2880" height="1024" alt="Yihan Zhang’s original resume: About me, Education, Internship Experience, Honors &amp; Awards, Professional Projects, Extracurricular Activates, and Interests.">
  </main>
</body>
</html>
